# Increases the amount of memory Gradle can use and optimizes the GC
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=false

# Project
version=1.0.3-beta1
group=net.frozenblock
java_version=21

# Common
minecraft_version=1.21.1
mod_name=Glowtone
mod_author=FrozenBlock
mod_id=glowtone
license=FrozenBlock Modding Oasis License v1.0
credits=Luna/AViewFromTheTop, Lufurrius
description=Allows for emissive textures to be quickly added as an overlay on both Block and Item models, as well as changing the render layers of blocks.
minecraft_version_range=[1.21.1, 1.22)
## This is the version of minecraft that the 'common' project uses, see https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version
parchment_minecraft=1.21
parchment_version=2024.11.10

# Fabric
fabric_version=0.115.6+1.21.1
fabric_loader_version=0.16.10

# NeoForge
neoforge_version=21.1.80
neoforge_loader_version_range=[4,)

# Optimization / soft dependencies
# Sodium 0.6+ is a unified multi-loader build (same net.caffeinemc.mods.sodium.client classes on Fabric and
# NeoForge). The lava-unshade compat mixin (SodiumDefaultFluidRendererMixin) targets it via @Pseudo string
# reference and needs no build dependency; this is only used for optional dev-runtime verification.
sodium_version=mc1.21.1-0.8.12

# Flywheel (Create's rendering backend, NeoForge). Used only as a compileOnly dependency to write the
# contraption emissive compat mixin (NeoforgeMeshEmitterMixin); the mixin is soft (skipped when absent).
flywheel_version=1.0.6
