# Increases the amount of memory Gradle can use and optimizes the GC
	# -XX:+UseZGC
	org.gradle.jvmargs=-Xmx4G
# Helps with build times
	org.gradle.parallel=true
# Caches Dependencies for faster build times.
	org.gradle.caching=true

# mod properties
	mod_id = glowtone
	mod_name = Glowtone
	mod_author = FrozenBlock
	mod_description = Allows for emissive textures to be quickly added as an overlay on both Block and Item models, as well as changing the render layers of blocks.
	license = FrozenBlock Modding Oasis License v1.0
	java_version = 25

# Fabric Properties
	# Get new versions at https://fabricmc.net/develop and https://lambdaurora.dev/tools/import_quilt.html
	minecraft_version=26.2
	fabric_loader_version=0.19.3
	min_fabric_loader_version=0.19.0

# Mod Properties
	mod_version = 1.0.2
	maven_group = net.frozenblock
	archives_base_name = Glowtone
	repository = FrozenBlock/Glowtone

# Publishing
	modrinth_project_id = 8yXsqoAM
	release_type = release

# Dependencies
	fabric_api_version=0.158.0+26.2
    frozenlib_version=3.0-mc26.2

# Optimization
	sodium_version=0.9.1+mc26.2
	run_sodium=false
# Dynamic Lights (Mod with 5k dependencies)
    lambdynamiclights_version=4.12.3+26.2
    yumi_commons_version=2.0.0
    yumi_mc_foundation_version=1.1.1+26.2
    spruceui_version=11.0.0+26.2
    pridelib_version=1.7.0+26.2
    run_lambdynamiclights=true
# Third-party renderers and particle backends, for compatibility testing only
    voxy_version=0.2.19-beta
    run_voxy=false
    nvidium_version=0.4.4-beta5-26.2
    run_nvidium=false
    asyncparticles_version=26.2.2.8
    run_asyncparticles=false

# NeoForge Properties (verify versions against the snapshot maven)
	neoforge_version=26.2.0.72
	neoforge_loader_version_range=[4,)

# Optional: set to a PR/snapshot NeoForge maven URL, or leave blank to skip
	neoforge_snapshot_maven=
